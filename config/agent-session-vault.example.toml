[paths]
home = "~"
workspace_root = "~/workspace"
import_root = "~/.config/tokscale/imports"
projection_home = "~/.config/tokscale/projection-home"
local_workspace_extras = "~/.config/tokscale/local-workspace-extras"
stable_root = "~/agent-session-vault/stable"

# Full-fidelity Codex archives are separate from the Tokscale projection.
# The root may be a local directory or a mounted NAS directory. Initialize it
# with agent-session-vault archive init before the first snapshot.
[archive]
root = "/Volumes/YourNAS/agent-session-vault"
cadence_days = 14
cold_age_days = 30
staging_root = "~/.cache/agent-session-vault/archive-staging"
machine_id_path = "~/.config/agent-session-vault/machine-id"
require_quiescent_for_prune = true

# Leave empty to use ~/.codex plus discovered workspace .codex roots.
# Add entries only when the archive source set must be explicit.
# source_paths = ["~/.codex", "~/workspace/project/.codex"]
